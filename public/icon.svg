      <stop offset="0" stop-color="#ffd9ea" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffd9ea" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#g)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
