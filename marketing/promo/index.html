<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daywell promo v2</title>
<style>
/* Daywell promo v2: 1080×1920, 120 s. Every frame is a pure function of time: film.js draws seek(t). */
@font-face { font-family: "Atkinson"; src: url(assets/fonts/atkinson.woff2) format("woff2"); font-weight: 200 800; }
@font-face { font-family: "Lexend"; src: url(assets/fonts/lexend.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: "OpenDyslexic"; src: url(assets/fonts/opendyslexic.woff2) format("woff2"); font-weight: 400; }
:root { --ink: #522d46; --muted: #7d536e; --accent: #803c65; --surface: #fff7fb; --moon: #f4e9f1; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #f7dfeb; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Atkinson", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
.layer { position: absolute; inset: 0; }
.abs { position: absolute; left: 0; top: 0; }

/* Sky */
#sky { background: #f7dfeb; }
#sun { width: 360px; height: 360px; margin: -180px 0 0 -180px; border-radius: 50%; background: radial-gradient(circle, rgba(255,236,196,.95) 0%, rgba(255,214,170,.55) 34%, rgba(255,200,170,0) 70%); }
#moon { width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: #f4e9f1; box-shadow: 0 0 60px 18px rgba(244,233,241,.25); }
#moon::after { content: ""; position: absolute; left: 34px; top: -10px; width: 120px; height: 120px; border-radius: 50%; background: var(--night, #241c3a); }
.star { position: absolute; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px rgba(255,255,255,.85); }
.blob { position: absolute; border-radius: 50%; }

/* World (the camera moves this) */
#world { transform-origin: 0 0; }

/* Hook calendar */
#hookCal { left: 90px; top: 520px; width: 900px; height: 1060px; border-radius: 56px; background: rgba(255,247,251,.92); box-shadow: 0 40px 90px rgba(82,45,70,.18); overflow: hidden; }
#hookCal .hdr { position: absolute; left: 48px; top: 36px; font-size: 40px; font-weight: 800; color: var(--muted); letter-spacing: -.01em; }
#hookCal .row { position: absolute; left: 48px; right: 40px; height: 1px; background: rgba(125,83,110,.16); }
#hookCal .hr { position: absolute; left: 48px; font-size: 28px; font-weight: 700; color: rgba(125,83,110,.6); }
.ev { position: absolute; left: 190px; width: 650px; height: 92px; border-radius: 28px; display: flex; align-items: center; gap: 22px; padding: 0 30px; font-size: 38px; font-weight: 700; color: #5b4656; background: #ece2e8; box-shadow: 0 12px 28px rgba(82,45,70,.12); }
.ev small { font-size: 28px; font-weight: 700; color: rgba(91,70,86,.7); min-width: 86px; }
.ev.you { background: #f3a6c4; color: #4b2340; font-size: 44px; }
.ev.you small { color: rgba(75,35,64,.75); }

/* Brand */
#brand { left: 0; top: 0; width: 1080px; height: 1920px; }
#mark { position: absolute; left: 540px; top: 1000px; width: 0; height: 0; }
#mark .sun { position: absolute; left: -150px; top: -150px; width: 300px; height: 300px; color: var(--accent); }
#mark .word { position: absolute; left: -400px; top: 190px; width: 800px; text-align: center; font-size: 120px; font-weight: 800; letter-spacing: -.035em; color: var(--ink); }
.helper { position: absolute; width: 170px; height: 170px; margin: -85px 0 0 -85px; }
.helper img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 16px 20px rgba(82,45,70,.22)); }

/* Phone */
#phone { left: 244px; top: 478px; width: 592px; height: 1244px; border-radius: 80px; background: #231a26; box-shadow: 0 50px 110px rgba(52,25,45,.38), inset 0 0 0 2px rgba(255,255,255,.08); }
#screen { position: absolute; left: 16px; top: 16px; width: 560px; height: 1212px; border-radius: 64px; overflow: hidden; background: #f9e3ee; }
#screen img.shot { position: absolute; left: 0; top: 0; width: 560px; height: 1212px; opacity: 0; }
#screen img.crop { position: absolute; opacity: 0; }
#island { position: absolute; left: 50%; top: 26px; width: 130px; height: 38px; margin-left: -65px; border-radius: 20px; background: #120d14; z-index: 30; }
#flash, #dim { position: absolute; inset: 0; opacity: 0; z-index: 20; }
#flash { background: #fff; }
#dim { background: #0b0812; }
.hl { position: absolute; border-radius: 22px; background: rgba(128,60,101,.18); box-shadow: 0 0 0 3px rgba(128,60,101,.35); opacity: 0; z-index: 19; }
#feed { position: absolute; inset: 0; background: #f4f4f6; opacity: 0; z-index: 18; overflow: hidden; }
.post { position: absolute; left: 22px; width: 516px; height: 520px; border-radius: 26px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.post .av { position: absolute; left: 22px; top: 20px; width: 56px; height: 56px; border-radius: 50%; background: #d9d6de; }
.post .nm { position: absolute; left: 94px; top: 30px; width: 180px; height: 16px; border-radius: 8px; background: #e2dfe6; }
.post .nm2 { position: absolute; left: 94px; top: 56px; width: 110px; height: 12px; border-radius: 6px; background: #ecebef; }
.post .im { position: absolute; left: 0; top: 96px; width: 516px; height: 330px; }
.post .ac { position: absolute; left: 24px; top: 448px; width: 260px; height: 40px; border-radius: 20px; background: #efedf2; }

/* The event card (the shape that never cuts) */
#card { border-radius: 34px; overflow: hidden; box-shadow: 0 30px 70px rgba(82,45,70,.28); opacity: 0; }
#card .inner { position: absolute; left: 0; top: 0; width: 560px; height: 1212px; opacity: 0; }
#card .fill { position: absolute; inset: 0; }
#card .lab { position: absolute; left: 30px; top: 0; height: 124px; display: flex; align-items: center; gap: 16px; white-space: nowrap; }
#card .lab b { font-size: 30px; font-weight: 800; color: rgba(75,35,64,.72); min-width: 80px; }
#card .lab span { font-size: 37px; font-weight: 800; color: #4b2340; letter-spacing: -.01em; }
#card .por { position: absolute; right: 16px; top: 18px; width: 88px; height: 88px; border-radius: 50%; overflow: hidden; background: rgba(255,255,255,.45); }
#card .por img { width: 100%; height: 100%; object-fit: cover; }

/* Ending stack */
.chip { position: absolute; left: 0; top: 0; width: 640px; height: 96px; margin: -48px 0 0 -320px; border-radius: 30px; display: flex; align-items: center; gap: 22px; padding: 0 26px; box-shadow: 0 16px 34px rgba(82,45,70,.18); white-space: nowrap; opacity: 0; }
.chip b { font-size: 30px; font-weight: 800; color: rgba(75,35,64,.72); min-width: 92px; }
.chip span { font-size: 40px; font-weight: 800; color: #4b2340; flex: 1; }
.chip i { width: 72px; height: 72px; border-radius: 50%; overflow: hidden; background: rgba(255,255,255,.5); }
.chip i img { width: 100%; height: 100%; object-fit: cover; }
#endcard { left: 0; top: 0; width: 1080px; height: 1920px; opacity: 0; }
#endcard .sun { position: absolute; left: 400px; top: 700px; width: 280px; height: 280px; color: var(--accent); }
#endcard .url { position: absolute; left: 0; right: 0; top: 1030px; text-align: center; font-size: 112px; font-weight: 800; letter-spacing: -.035em; color: var(--ink); }

/* Screen-space overlays */
#captions { left: 60px; right: 60px; top: 196px; height: 260px; }
.cap { position: absolute; left: 0; right: 0; top: 0; height: 260px; display: flex; align-items: center; justify-content: center; text-align: center; opacity: 0; }
.cap p { margin: 0; font-size: 76px; font-weight: 800; line-height: 1.08; letter-spacing: -.015em; text-wrap: balance; max-width: 960px; }
.cap .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 .04em .1em; margin-bottom: -.1em; }
.cap .wi { display: inline-block; }
.cap .acc { color: var(--accent); }
#captions.light .acc { color: #f6b8d6; }
#finger { width: 76px; height: 76px; margin: -38px 0 0 -38px; opacity: 0; z-index: 50; }
#finger .dot { position: absolute; inset: 0; border-radius: 50%; background: rgba(255,255,255,.86); box-shadow: 0 0 0 3px rgba(82,45,70,.55), 0 10px 26px rgba(40,20,35,.38); }
#finger .ring { position: absolute; left: -10px; top: -10px; width: 96px; height: 96px; border-radius: 50%; border: 4px solid rgba(255,255,255,.95); opacity: 0; }
.bubble { position: absolute; left: 0; top: 0; max-width: 820px; display: flex; align-items: center; gap: 22px; padding: 22px 34px 22px 22px; border-radius: 44px; background: rgba(255,247,251,.97); box-shadow: 0 24px 60px rgba(82,45,70,.28); opacity: 0; transform-origin: 0 100%; }
.bubble i { flex: none; width: 132px; height: 132px; border-radius: 50%; overflow: hidden; background: rgba(243,197,181,.5); }
.bubble i img { width: 100%; height: 100%; object-fit: cover; }
.bubble span { font-size: 44px; font-weight: 700; line-height: 1.22; color: var(--ink); }
</style>
</head>
<body>
<div id="stage">
  <div id="sky" class="layer">
    <div class="blob" id="blobA"></div><div class="blob" id="blobB"></div>
    <div id="stars" class="layer"></div>
    <div id="sun" class="abs"></div>
    <div id="moon" class="abs"></div>
  </div>
  <div id="world" class="layer">
    <div id="hookCal" class="abs"></div>
    <div id="brand" class="abs"><div id="helpers"></div><div id="mark"></div></div>
    <div id="phone" class="abs">
      <div id="screen">
        <div id="shots"></div>
        <div id="feed"></div>
        <div id="hls"></div>
        <div id="flash"></div><div id="dim"></div>
      </div>
      <div id="island"></div>
    </div>
    <div id="card" class="abs"><div class="fill"></div><div class="inner"></div><div class="lab"><b></b><span></span></div><div class="por"><img alt=""></div></div>
    <div id="chips" class="abs"></div>
  </div>
  <div id="endcard" class="abs"></div>
  <div id="capband" class="abs" style="left:0;top:0;width:1080px;height:560px;opacity:0"></div>
  <div id="bubbles" class="layer"></div>
  <div id="captions" class="abs"></div>
  <div id="finger" class="abs"><div class="ring"></div><div class="dot"></div></div>
</div>
<script src="data/film-data.js"></script>
<script src="film.js"></script>
</body>
</html>
